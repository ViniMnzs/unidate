name: release

# Duas portas de entrada:
#
#   push em main  -> atualiza a prerelease rolante "main-latest", sempre com o
#                    build mais novo. Não gera versão nova a cada commit, que
#                    encheria a página de Releases de ruído.
#   push de tag v* -> release estável e imutável daquela versão.
#
# Commits que só mexem em documentação não disparam build: dois runners macOS
# por push custam de 10 a 20 minutos de fila para nada.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: write

# Push em sequência: o build antigo é descartado em vez de correr contra o novo.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  montar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # A suíte roda sem macOS e sem permissão de Calendário (stub de EventKit),
      # então serve de porta antes de gastar tempo empacotando.
      - name: Testes
        run: python3 tests/test_unidate.py

      - name: Montar o app
        run: ./build_app.sh

      - name: Conferir a arquitetura do binário
        run: file dist/unidate.app/Contents/MacOS/unidate

      # ditto preserva symlinks e resource forks do bundle; zip comum quebra.
      - name: Empacotar
        run: ditto -c -k --sequesterRsrc --keepParent dist/unidate.app dist/unidate-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: unidate-${{ matrix.arch }}
          path: dist/unidate-${{ matrix.arch }}.zip
          if-no-files-found: error

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se o histórico foi reescrito depois que este run começou, a tag ficou
      # obsoleta: publicar aqui recriaria a tag apontando para um commit que já
      # saiu de main, ressuscitando-o. Aborta em vez de publicar.
      - name: Conferir que o commit ainda está em main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O commit $GITHUB_SHA não está mais em main (histórico reescrito). Abortando a publicação."
            exit 1
          fi
          echo "commit $GITHUB_SHA confirmado em main"

      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh artefatos

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            # Idempotente de propósito: a release pode já existir (criada à mão,
            # ou por um run anterior). Troca os arquivos em vez de falhar.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG existe; substituindo os arquivos"
              gh release upload "$TAG" artefatos/*.zip --clobber
            else
              gh release create "$TAG" artefatos/*.zip \
                --title "unidate $TAG" --target "$GITHUB_SHA" --generate-notes
            fi
          else
            printf 'Build automático do commit %s.\n\nNão é uma versão estável: é sempre o topo do main. Para uma versão fixa, use a release mais recente sem o rótulo de pré-lançamento.\n' \
              "${GITHUB_SHA:0:7}" > notas.md
            # A rolante aponta para o commit atual: apaga tag e release antigas
            # em vez de mover a tag, que confunde quem já clonou.
            gh release delete main-latest --yes --cleanup-tag || true
            gh release create main-latest artefatos/*.zip \
              --title "Build mais recente do main" --target "$GITHUB_SHA" \
              --prerelease --notes-file notas.md
          fi
